plan_id: saas_ae_plan
name: "SaaS AE Standard Plan"
period_type: monthly
currency: USD
rules:
  - id: tiered_core
    type: tiered
    tiers:
      - threshold_pct: 1.0
        rate: 0.05
      - threshold_pct: 1.5
        rate: 0.08
      - threshold_pct: 100.0
        rate: 0.12
  - id: enterprise_spif
    type: flat_rate
    rate: 0.02
    filter: 'product == "Enterprise"'

# Self-checking: `icm check-plan examples/saas_ae_plan.yaml`
# (the Enterprise SPIF needs a product field, so plain assertion deals
#  exercise the core tiers only)
assertions:
  - name: "100% of quota pays 5,000 on the core tiers"
    quota: "100000"
    deals: ["100000"]
    expect_total: "5000"          # 100000 * 0.05
  - name: "a deal crossing quota splits 5% / 8%"
    quota: "100000"
    deals: ["120000"]
    expect_total: "6600"          # 100000*0.05 + 20000*0.08
