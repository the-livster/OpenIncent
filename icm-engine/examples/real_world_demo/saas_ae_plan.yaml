plan_id: saas_ae
name: "SaaS AE Plan"
period_type: monthly
currency: USD
pro_rating: daily
payout_cap: "25000"
draw:
  amount: "3000"
  recoverable: false

rules:
  - id: tiered_core
    type: tiered
    tiers:
      - threshold_pct: "0.5"
        rate: "0.05"
      - threshold_pct: "1.0"
        rate: "0.08"
      - threshold_pct: "1.5"
        rate: "0.12"
      - threshold_pct: "100.0"
        rate: "0.15"
    min_attainment_pct: "0.25"

  - id: enterprise_spif
    type: flat_rate
    rate: "0.02"
    filter: 'product == "Enterprise"'
    cap: "5000"

  - id: new_logo_accel
    type: accelerator
    rate: "0.08"
    threshold_pct: "1.0"
    multiplier: "1.5"
    filter: 'product == "New Logo"'
