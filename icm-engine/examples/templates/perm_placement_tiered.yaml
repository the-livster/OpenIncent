plan_id: perm_placement
name: "Permanent Placement - Tiered Fee"
period_type: monthly
currency: USD
ote: "3000"                 # monthly on-target commission at 100% of quota
# A perm recruiter earns a percentage of placement fees billed, tiered so the
# portion of billings above target pays a higher rate (boundary-crossing).
rules:
  - id: placement_fee
    type: tiered
    tiers:
      - threshold_pct: "1.0"     # 0 -> 100% of quota
        rate: "0.12"
      - threshold_pct: "100.0"   # everything above 100%
        rate: "0.18"
assertions:
  - name: "100% of quota pays the $3,000 OTE"
    quota: "25000"
    deals: ["25000"]
    expect_total: "3000"          # 25000 * 0.12
  - name: "a deal crossing 100% splits 12% / 18%"
    quota: "25000"
    deals: ["30000"]
    expect_total: "3900"          # 25000*0.12 + 5000*0.18
