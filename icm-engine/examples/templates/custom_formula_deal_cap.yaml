plan_id: custom_deal_cap
name: "Custom Formula - Per-Deal Commission Cap"
period_type: monthly
currency: USD
ote: "3000"
# The `formula` rule is the escape hatch for plans the built-in rule types
# can't express. Here: 6% per deal, but no single deal pays more than $500 —
# a PER-DEAL cap, which `cap:` can't do (that caps the payee's period total).
#
# Formulas see: amount, margin, quota, attainment_pct, bookings, product, and
# any metadata column. Functions: min, max, abs, round, floor, ceil,
# if(condition, then, else). All math is exact Decimal.
rules:
  - id: capped_deal_rate
    type: formula
    formula: "min(0.06 * amount, 500)"
assertions:
  - name: "normal deal pays 6%"
    quota: "50000"
    deals: ["5000"]
    expect_total: "300"           # 5000 * 0.06
  - name: "whale deal is capped at $500 (not $1,200)"
    quota: "50000"
    deals: ["20000"]
    expect_total: "500"           # min(1200, 500)
  - name: "100% of quota through mixed deals pays $1,100"
    quota: "50000"
    deals: ["5000", "5000", "40000"]
    expect_total: "1100"          # 300 + 300 + min(2400, 500)
