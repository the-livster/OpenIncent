[project]
name = "icm-engine"
version = "0.3.0"
description = "Open-source incentive compensation calculation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "slowapi>=0.1.9",
    "typer>=0.25.0",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.97.0"]
desktop = ["cryptography>=43.0.0"]
excel = ["openpyxl>=3.1.5", "rapidfuzz>=3.14.5"]
parquet = ["pyarrow>=15.0.0"]
pdf = ["fpdf2>=2.8.0"]
all = ["icm-engine[ai,desktop,excel,parquet,pdf]"]

[project.scripts]
icm = "icm_engine.cli:app"

[tool.icm-engine]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "icm-engine[all]",
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pywebview>=6.2.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["icm_engine"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -v"
markers = [
    "live: tests that hit the real Anthropic API (opt-in with ICM_RUN_LIVE_LLM_TESTS=1)",
]
