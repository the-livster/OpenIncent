- name: flat_rate_basic
  description: "Single flat-rate rule, one transaction"
  plan:
    plan_id: eval_flat
    name: Flat Rate Eval
    period_type: monthly
    currency: USD
    rules:
      - type: flat_rate
        id: R-001
        rate: "0.05"
  transactions:
    - id: T001
      payee_id: P001
      deal_id: D001
      period: "2026-01"
      amount: "10000"
      close_date: "2026-01-15"
  payees:
    - id: P001
      name: Alice
      quota: "100000"
      plan_id: eval_flat
      effective_from: "2026-01-01"
  expected_commissions:
    - transaction_id: T001
      payee_id: P001
      rule_id: R-001
      commission_amount: "500"

- name: flat_rate_with_filter
  description: "Flat rate with product filter — only Enterprise deals"
  plan:
    plan_id: eval_filter
    name: Filter Eval
    period_type: monthly
    currency: USD
    rules:
      - type: flat_rate
        id: R-001
        rate: "0.10"
        filter: 'product == "Enterprise"'
  transactions:
    - id: T001
      payee_id: P001
      deal_id: D001
      period: "2026-01"
      amount: "5000"
      product: Enterprise
      close_date: "2026-01-10"
    - id: T002
      payee_id: P001
      deal_id: D002
      period: "2026-01"
      amount: "3000"
      product: Standard
      close_date: "2026-01-12"
  payees:
    - id: P001
      name: Alice
      quota: "100000"
      plan_id: eval_filter
      effective_from: "2026-01-01"
  expected_commissions:
    - transaction_id: T001
      payee_id: P001
      rule_id: R-001
      commission_amount: "500"

- name: tiered_single_tier
  description: "Tiered rule where all revenue stays in the first tier"
  plan:
    plan_id: eval_tier1
    name: Tiered Eval
    period_type: monthly
    currency: USD
    rules:
      - type: tiered
        id: R-001
        tiers:
          - threshold_pct: "1.0"
            rate: "0.05"
          - threshold_pct: "1.5"
            rate: "0.08"
          - threshold_pct: "999"
            rate: "0.12"
  transactions:
    - id: T001
      payee_id: P001
      deal_id: D001
      period: "2026-01"
      amount: "5000"
      close_date: "2026-01-15"
  payees:
    - id: P001
      name: Alice
      quota: "100000"
      plan_id: eval_tier1
      effective_from: "2026-01-01"
  expected_commissions:
    - transaction_id: T001
      payee_id: P001
      rule_id: R-001
      commission_amount: "250"

