name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icm-engine

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # Same scope as `make lint`, so the Makefile and CI can't disagree.
      - name: Ruff
        run: uv run ruff check src/ tests/

      # The runner is Linux but the shipped artifact is a Windows .exe, so
      # check both platforms — each one sees code the other marks unreachable.
      - name: Mypy (Linux)
        run: uv run mypy --platform linux src/icm_engine/

      - name: Mypy (Windows)
        run: uv run mypy --platform win32 src/icm_engine/

      - name: Pytest
        run: uv run pytest --tb=short

  ui:
    name: UI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icm-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icm-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
